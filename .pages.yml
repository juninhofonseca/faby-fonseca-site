media:
  - name: photos
    label: Fotos do portfólio
    input: content/photos/images
    output: images
    rename: safe
    extensions: [jpg, jpeg, png, webp]

  - name: home
    label: Foto da página inicial
    input: content/home/images
    output: images
    rename: safe
    extensions: [jpg, jpeg, png, webp]

content:
  - name: home
    label: Página inicial
    type: file
    path: content/home/index.md
    format: yaml-frontmatter
    fields:
      - name: heroTitle
        label: Título do destaque
        type: string
        description: Aparece como título principal da home. Até 80 caracteres.
      - name: heroText
        label: Frase de apresentação
        type: text
        description: Resume o trabalho em uma ou duas frases. Até 240 caracteres.
      - name: heroImage
        label: Foto de destaque
        type: image
        options:
          media: home
      - name: heroAlt
        label: Texto alternativo da foto
        type: string
        description: Descreva a foto para quem não pode vê-la. Até 160 caracteres.
      - name: featuredCategories
        label: Categorias em destaque
        type: reference
        options:
          collection: categories
          multiple: true
          min: 3
          max: 3
          value: "{fields.slug}"
          label: "{fields.name}"
          search: "fields.name"
        description: Escolha exatamente três categorias ativas, na ordem em que devem aparecer.
      - name: aboutTitle
        label: Título da seção sobre a Faby
        type: string
        description: Até 60 caracteres.
      - name: aboutText
        label: Texto sobre a Faby
        type: text
        description: Até 600 caracteres. Deixe uma linha em branco entre parágrafos.

  - name: categories
    label: Categorias
    type: collection
    path: content/categories
    filename: "{fields.slug}.md"
    view:
      primary: name
    fields:
      - name: name
        label: Nome
        type: string
      - name: slug
        label: Slug
        type: string
        description: Letras minúsculas, números e hífens. Não altere depois de publicado.
      - name: description
        label: Descrição curta
        type: text
      - name: order
        label: Ordem
        type: number
      - name: active
        label: Ativa
        type: boolean

  - name: photos
    label: Fotos
    type: collection
    path: content/photos
    filename: "{fields.title}.md"
    view:
      primary: title
    fields:
      - name: title
        label: Título interno
        type: string
      - name: alt
        label: Texto alternativo
        type: string
        description: Descreva a foto para quem não pode vê-la. Máximo de 160 caracteres.
      - name: image
        label: Imagem
        type: image
        options:
          media: photos
      - name: category
        label: Categoria
        type: reference
        options:
          collection: categories
          value: "{fields.slug}"
          label: "{fields.name}"
          search: "fields.name"
      - name: order
        label: Ordem na categoria
        type: number
      - name: publishedAt
        label: Data de publicação
        type: date
      - name: published
        label: Publicada
        type: boolean
