  - name: home
    label: Página inicial
    type: file
    path: content/home/index.md
    format: yaml-frontmatter
    fields:
      - name: heroTitle
        label: Título do destaque
        type: string
        description: Aparece como título principal da home. Até 80 caracteres.
      - name: heroText
        label: Frase de apresentação
        type: text
        description: Resume o trabalho em uma ou duas frases. Até 240 caracteres.
      - name: heroImage
        label: Foto de destaque
        type: image
        options:
          media: home
      - name: heroAlt
        label: Texto alternativo da foto
        type: string
        description: Descreva a foto para quem não pode vê-la. Até 160 caracteres.
      - name: featuredCategories
        label: Categorias em destaque
        type: select
        options:
          multiple: true
          min: 3
          max: 3
          values:
            - name: casamentos
              label: Casamentos
            - name: ensaios
              label: Ensaios
            - name: familia
              label: Família
            - name: newborn
              label: Newborn
            - name: eventos
              label: Eventos
        description: Escolha exatamente três categorias. A ordem de exibição segue a ordem do portfólio.
      - name: aboutTitle
        label: Título da seção sobre a Faby
        type: string
        description: Até 60 caracteres.
      - name: aboutSummary
        label: Resumo sobre a Faby
        type: text
        description: Até 400 caracteres. O texto completo fica na página Sobre.

  - name: sobre
    label: Sobre
    type: file
    path: content/sobre/index.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Título
        type: string
      - name: intro
        label: Introdução
        type: text
      - name: body
        label: Texto de apresentação
        type: rich-text
        required: true
        options:
          format: markdown
          media: false
      - name: image
        label: Retrato
        type: image
        options:
          media: sobre
      - name: imageAlt
        label: Texto alternativo do retrato
        type: string
      - name: updatedAt
        label: Atualizado em
        type: date
