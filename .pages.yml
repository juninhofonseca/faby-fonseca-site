media:
  - name: portfolio-casamentos
    label: Fotos — Casamentos
    input: content/portfolio/casamentos/imagens
    output: imagens
    rename: safe
    extensions: [jpg, jpeg, png, webp]
  - name: portfolio-ensaios
    label: Fotos — Ensaios
    input: content/portfolio/ensaios/imagens
    output: imagens
    rename: safe
    extensions: [jpg, jpeg, png, webp]
  - name: portfolio-familia
    label: Fotos — Família
    input: content/portfolio/familia/imagens
    output: imagens
    rename: safe
    extensions: [jpg, jpeg, png, webp]
  - name: portfolio-newborn
    label: Fotos — Newborn
    input: content/portfolio/newborn/imagens
    output: imagens
    rename: safe
    extensions: [jpg, jpeg, png, webp]
  - name: portfolio-eventos
    label: Fotos — Eventos
    input: content/portfolio/eventos/imagens
    output: imagens
    rename: safe
    extensions: [jpg, jpeg, png, webp]
  - name: home
    label: Foto da página inicial
    input: content/home/images
    output: images
    rename: safe
    extensions: [jpg, jpeg, png, webp]
  - name: sobre
    label: Foto da página Sobre
    input: content/sobre/images
    output: images
    rename: safe
    extensions: [jpg, jpeg, png, webp]

content:
  - name: portfolio
    label: Portfólio
    type: group
    items:
      - name: casamentos
        label: Casamentos
        type: file
        path: content/portfolio/casamentos/index.md
        format: yaml-frontmatter
        fields:
          - name: name
            label: Nome
            type: string
          - name: slug
            label: Slug
            type: string
            readonly: true
            description: Não altere depois de publicado.
          - name: description
            label: Descrição curta
            type: text
          - name: order
            label: Ordem
            type: number
          - name: active
            label: Ativa
            type: boolean
            readonly: true
            description: Fixo em verdadeiro nesta versão; as cinco categorias são sempre publicadas.
          - name: photos
            label: Fotos
            type: object
            list: true
            fields:
              - name: title
                label: Título interno
                type: string
              - name: alt
                label: Texto alternativo
                type: string
              - name: image
                label: Imagem
                type: image
                options:
                  media: portfolio-casamentos
              - name: order
                label: Ordem
